repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint (locked project environment)
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format (changed Python files)
        entry: uv run --frozen ruff format --check --force-exclude --
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy (locked project environment)
        entry: uv run --frozen mypy .
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
