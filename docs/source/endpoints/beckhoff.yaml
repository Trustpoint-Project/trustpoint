vendor: Beckhoff Automation
vendor_id: beckhoff
schema_notes:
- A management field is true only when that interface can be used for certificate
  management, not merely because the interface exists.
- OPC UA GDS capability is provided by the TwinCAT OPC UA Server software and therefore
  requires that component to be installed/licensed on the Beckhoff target.
- EST, CMP, SCEP and ACME are marked false for native TwinCAT OPC UA Server certificate
  management because Beckhoff documents GDS Push/Pull as the standardized enrollment
  mechanisms for this component.
- For open platforms where arbitrary user software can be deployed, PKI protocols
  may be marked implementable even when they are not provided natively by Beckhoff.
sources:
- id: beckhoff-gds-overview
  type: vendor_documentation
  title: TwinCAT OPC UA Server - GDS Overview
  url: https://infosys.beckhoff.com/content/1033/ts6100_tc2_opcua_server/15617762187.html
  notes: Beckhoff states that the TwinCAT OPC UA Server supports both GDS Push and
    GDS Pull models.
- id: beckhoff-gds-push
  type: vendor_documentation
  title: TwinCAT OPC UA Server - GDS Push
  url: https://infosys.beckhoff.com/content/1033/ts6100_tc2_opcua_server/15617765131.html
  notes: The standardized Push interface is enabled by default and may be used by
    any compatible OPC UA client/GDS workflow with administrator rights.
- id: beckhoff-gds-pull
  type: vendor_documentation
  title: TwinCAT OPC UA Server - GDS Pull
  url: https://infosys.beckhoff.com/content/1033/ts6100_tc2_opcua_server/15617766283.html
  notes: The TwinCAT OPC UA Server can register itself with a GDS, obtain and update
    its application certificate and CRL, and can be configured with the TwinCAT OPC
    UA Configurator.
