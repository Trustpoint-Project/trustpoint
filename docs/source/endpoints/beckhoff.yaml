- product_family: Industrial PC
  model: C6025
  device_type: Industrial PC / TwinCAT runtime platform
  inventory_firmware_versions:
  - unknown
  firmware:
  - versions:
    - TwinCAT OPC UA Server supported installation
    prerequisites:
    - TwinCAT OPC UA Server installed and licensed
    certificate_protocols:
      est:
        native: false
        implementable: true
      cmp:
        native: false
        implementable: true
      scep:
        native: false
        implementable: true
      acme:
        native: false
        implementable: true
    industrial_certificate_management:
      opcua_gds_push: true
      opcua_gds_pull: true
    management:
      web_ui: false
      ssh: false
      sftp: false
      scp: false
      rest_api: false
      vendor_api: false
      vendor_tool:
        supported: true
        name: TwinCAT OPC UA Configurator
      agent_possible: true
    trustpoint:
      recommended_integration: opcua_gds_push
      alternative_integrations:
      - opcua_gds_pull
      - trustpoint_agent
      supported: candidate
      tested: false
      profile: null
      limitations:
      - GDS functionality depends on the TwinCAT OPC UA Server software, not only
        on the C6025 hardware.
    evidence:
      verification_status: vendor_documented
      source_ids:
      - beckhoff-gds-overview
      - beckhoff-gds-push
      - beckhoff-gds-pull
      notes: GDS support is attributed
        to TwinCAT OPC UA Server running on the platform.
