vendor: Siemens
vendor_id: siemens
sources:
- id: siemens-cert-tia
  type: vendor_documentation
  title: Using Certificates with TIA Portal, Entry ID 109769068 V2.1
  url: https://support.industry.siemens.com/cs/attachments/109769068/109769068_UsingCertificatesWithTIAPortal_DOC_V2_1_en.pdf
  notes: Siemens documents certificate management for S7-1500 CPUs with TIA Portal from CPU firmware V2.0.
    GDS Push is supported for the OPC UA server from firmware V2.9 and for the web server from firmware
    V3.0.
- id: siemens-s71500-comm
  type: vendor_documentation
  title: SIMATIC S7-1500 Communication Function Manual
  url: https://support.industry.siemens.com/cs/attachments/59192925/s71500_communication_function_manual_en-US_en-US.pdf
  notes: Siemens documents that S7-1500 supports OPC UA GDS Push from firmware V2.9 and currently supports
    push management only, not pull management.
