sources:
- id: rockwell-ftpm-apd
  type: vendor_documentation
  title: Automatic Policy Deployment - FactoryTalk Policy Manager 6.60
  url: https://www.rockwellautomation.com/en-pr/docs/factorytalk-policy-manager/6-60/help-ditamap/policy-model-configuration/policy-management-capabilities/cip-security/automatic-policy-deployment.html
  notes: Rockwell Automation documents that Automatic Policy Deployment uses the Enrollment
    over Secure Transport (EST) service. The documented minimum firmware is 34.00
    for ControlLogix 5580 and CompactLogix 5380 controllers.
- id: rockwell-ftpm-cip-security
  type: vendor_documentation
  title: CIP security policy - FactoryTalk Policy Manager 6.60
  url: https://www.rockwellautomation.com/en-us/docs/factorytalk-policy-manager/6-60/help-ditamap/policy-model-configuration/policy-management-capabilities/cip-security.html
  notes: Rockwell Automation documents FactoryTalk Policy Manager CIP Security compatibility
    for ControlLogix 5580 firmware 32.00 or later and CompactLogix 5380 firmware 34.00
    or later.
