services:
  trustpoint:
    build:
      context: .
      dockerfile: docker/trustpoint/Dockerfile
    image: "${TRUSTPOINT_IMAGE:-trustpointproject/trustpoint:latest}"
    container_name: trustpoint
    restart: unless-stopped
    ports:
      - "${TP_HTTP_PORT:-80}:80"
      - "${TP_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      TRUSTPOINT_PHASE: "${TRUSTPOINT_PHASE:-auto}"
      POSTGRES_DB: "${POSTGRES_DB:-trustpoint_db}"
      DATABASE_USER: "${DATABASE_USER:-admin}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:-testing321}"
      TRUSTPOINT_SOFTWARE_KEK_FILE: "${TRUSTPOINT_SOFTWARE_KEK_FILE:-/run/secrets/trustpoint_software_kek}"
      DJANGO_SECRET_KEY_FILE: "${DJANGO_SECRET_KEY_FILE:-/run/secrets/django_secret_key}"
      DATABASE_HOST: "${DATABASE_HOST:-postgres}"
      DATABASE_PORT: "${DATABASE_PORT:-5432}"
    volumes:
      - trustpoint_bootstrap:/var/lib/trustpoint/bootstrap
      - trustpoint_media:/var/www/html/trustpoint/trustpoint/media
      - trustpoint_hsm:/var/lib/trustpoint/hsm
    secrets:
      - source: trustpoint_software_kek
        target: "${TRUSTPOINT_SOFTWARE_KEK_FILE:-/run/secrets/trustpoint_software_kek}"
      - source: django_secret_key
        target: "${DJANGO_SECRET_KEY_FILE:-/run/secrets/django_secret_key}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk --max-time 5 https://localhost/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  postgres:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    image: trustpointproject/postgres:latest
    container_name: postgres
    restart: unless-stopped
    ports:
      # Bind to loopback only – PostgreSQL must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: "${DATABASE_USER:-admin}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-testing321}"
      POSTGRES_DB: "${POSTGRES_DB:-trustpoint_db}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  trustpoint_bootstrap:
  trustpoint_media:
  trustpoint_hsm:

networks:
  default:
    name: "${TRUSTPOINT_NETWORK_NAME:-trustpoint-net}"

secrets:
  trustpoint_software_kek:
    file: "${TRUSTPOINT_SOFTWARE_KEK_HOST_FILE:-./secrets/trustpoint_software_kek}"
  django_secret_key:
    file: "${DJANGO_SECRET_KEY_HOST_FILE:-./secrets/django_secret_key}"
