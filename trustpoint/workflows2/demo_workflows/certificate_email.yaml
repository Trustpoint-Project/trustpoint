# Requires successful CMP initialization issuance from any domain. Uses Mailpit from
# docker-compose.demo.yml. In Management > Settings > SMTP Email, enable SMTP with host mailpit,
# port 1025, no TLS/SSL, and blank username/password. Enable this workflow and Save & Compile.
# View captured messages at http://localhost:8025. When Trustpoint runs on the host instead of
# Docker, use SMTP host localhost. Sends final certificate attributes after issuance.

schema: trustpoint.workflow.v2
name: '[Demo] Issued certificate email'
enabled: false
trigger:
  on: cmp.initialization
  phase: after_issuance
  sources:
    trustpoint: true
workflow:
  start: notify
  steps:
    notify:
      type: email
      title: Email issued certificate details
      to: [operator@trustpoint.example]
      subject: 'Certificate issued for ${event.device.common_name}'
      body: |-
        Final certificate common name: ${event.request.subject.common_name}
        Final certificate subject serialNumber: ${event.request.subject.serial_number}
        Device: ${event.device.common_name}
        Profile: ${event.cmp.cert_profile}
  flow: []
