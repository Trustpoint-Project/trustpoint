{% extends 'trustpoint/base.html' %}
{% load i18n %}
{% load crispy_forms_filters %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1>{% trans 'Issue Domain Credential' %}</h1>
    </div>

    <div class="card-body text-start">
        <div class="tp-card-centered-content">
            <form id="domain-credential-form" method="post" autocomplete="off">
                {% csrf_token %}
                {{ form|crispy }}
            </form>
        </div>
    </div>

    <div class="card-footer d-flex justify-content-between align-items-center">
        <a href="{% url clm_url pk=device.pk %}" class="btn btn-secondary">
            {% trans 'Cancel' %}
        </a>
        <button type="submit" form="domain-credential-form" class="btn btn-primary">
            {% trans 'Issue Domain Credential' %}
        </button>
    </div>
</div>
{% endblock content %}
