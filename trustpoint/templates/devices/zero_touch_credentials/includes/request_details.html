{% load i18n %}
<div class="tp-kvp-list">
    <div>
        <div>{% trans 'Common Name' %}</div>
        <div>{{ owner_credential.common_name|default:"—" }}</div>
    </div>
    {% if owner_credential.ca %}
    <div>
        <div>{% trans 'Management CA' %}</div>
        <div>
            <a href="{% url 'pki:issuing_cas-config' pk=owner_credential.ca.pk %}">
                {{ owner_credential.ca.unique_name }}
            </a>
        </div>
    </div>
    <div>
        <div>{% trans 'CA Type' %}</div>
        <div>{{ owner_credential.ca.get_ca_type_display }}</div>
    </div>
    {% endif %}
</div>
