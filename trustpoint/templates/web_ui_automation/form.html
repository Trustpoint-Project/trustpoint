{% extends "trustpoint/base.html" %}
{% load i18n %}
{% load crispy_forms_filters %}

{% block content %}
<div class="card">
    <div class="card-header"><h1>{{ title }}</h1></div>
    <form method="post">
        <div class="card-body">
            {% csrf_token %}
            {{ form|crispy }}
        </div>
        <div class="card-footer d-flex gap-2">
            <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
            <button type="button" class="btn btn-secondary" onclick="history.back()">{% trans "Back" %}</button>
        </div>
    </form>
</div>
{% endblock content %}
