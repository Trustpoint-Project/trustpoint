{% load i18n crispy_forms_filters %}
<div class="modal fade" id="truststoreImportModal" tabindex="-1" aria-labelledby="truststoreImportModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" enctype="multipart/form-data" id="importForm">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title" id="truststoreImportModalLabel">{% trans 'Import Truststore' %}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="tp-card-centered-content">
                        <h2>{% trans 'File Import' %}</h2>
                        <hr>
                        {{ import_form|crispy }}
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans 'Cancel' %}</button>
                    <button type="submit" class="btn btn-primary">{% trans 'Add new Truststore' %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
