{% load i18n %}

<div id="profile-builder-sidebar" class="tp-pb-sidebar">
  <div class="tp-pb-header">
    <span class="tp-pb-title">{% trans 'Select a field to insert' %}</span>
    <button type="button" class="tp-pb-close" data-pb-close aria-label="{% trans 'Close profile builder' %}">×</button>
  </div>

  <div class="tp-pb-search">
    <input
      type="text"
      id="profile-builder-search"
      placeholder="{% trans 'Search fields' %}"
      aria-label="{% trans 'Search profile fields' %}"
      autocomplete="off"
    />
  </div>

  <div id="profile-builder-fields" class="tp-pb-fields">

  </div>

  <div class="tp-pb-footer">
    <span>{% blocktrans %}Press <kbd>Ctrl+K</kbd> to toggle{% endblocktrans %}</span>
    <span>{% blocktrans %}Press <kbd>Esc</kbd> to close{% endblocktrans %}</span>
  </div>
</div>
