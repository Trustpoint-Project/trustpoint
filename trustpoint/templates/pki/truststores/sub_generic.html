{% load i18n %}
{% load internationalization_tags %}
{% block sub_details %}
    <div class="tp-kvp-list">
        <div>
            <div>{% trans 'Unique Name' %}</div>
            <div>
                <a href="{% url 'pki:truststore-detail' pk=truststore.id %}"> {{ truststore.unique_name }} </a>
            </div>
        </div>
        <div>
            <div>{% trans 'Intended Usage' %}</div>
            <div>
                {{ truststore.get_intended_usage_display }}
            </div>
        </div>
        <div>
            <div>{% trans 'Created at' %}</div>
            <div>
                {{ truststore.created_at|local_datetime }}
            </div>
        </div>
    </div>
{% endblock sub_details %}
