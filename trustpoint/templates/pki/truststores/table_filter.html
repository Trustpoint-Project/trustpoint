{% load i18n %}

{% block table_filter %}
  <div class="d-flex flex-wrap gap-2 align-items-center">
    <div class="dropdown mb-1">
      <button class="btn btn-sm {% if filters_active %}btn-primary{% else %}btn-outline-secondary{% endif %} dropdown-toggle"
              type="button"
              id="tp-filter-dropdown-btn"
              data-bs-toggle="dropdown"
              data-bs-auto-close="outside"
                aria-expanded="false">
              {% trans 'Filters' %}{% if filters_active %}<span class="ms-1">· {% trans 'Active' %}</span>{% endif %}
      </button>
      <div class="dropdown-menu p-3" id="tp-filter-dropdown-menu" style="min-width: 22rem;">
        <form method="get" class="d-flex flex-column gap-2">

          <div>
            <label for="{{ filter.form.unique_name.id_for_label }}" class="form-label mb-1 fw-semibold">
              {{ filter.form.unique_name.label }}
            </label>
            {{ filter.form.unique_name }}
          </div>

          <div>
            <label for="{{ filter.form.intended_usage.id_for_label }}" class="form-label mb-1 fw-semibold">
              {{ filter.form.intended_usage.label }}
            </label>
            {{ filter.form.intended_usage }}
          </div>

          <div class="d-flex justify-content-between gap-2 mt-1">
            <a href="{% url table_url %}" class="btn btn-outline-secondary btn-sm">
              {% trans 'Reset' %}
            </a>
            <button type="submit" class="btn btn-primary btn-sm">
              {% trans 'Apply Filters' %}
            </button>
          </div>

        </form>
      </div>
    </div>

    {% include "shared/partials/export_button.html" %}

  </div>

{% endblock table_filter %}
