{% load i18n %}
<div>
    <div>
        {% trans 'Status' %}
    </div>

    <div class="d-flex flex-wrap gap-1">
        {% if crl.is_active %}
            <span class="badge text-bg-success">
                {% trans 'Active' %}
            </span>
        {% else %}
            <span class="badge text-bg-secondary">
                {% trans 'Inactive' %}
            </span>
        {% endif %}

        {% if crl.is_expired %}
            <span class="badge text-bg-warning">
                {% trans 'Expired' %}
            </span>
        {% endif %}
    </div>
</div>
