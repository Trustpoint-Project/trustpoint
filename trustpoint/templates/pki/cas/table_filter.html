{% load i18n %}

{% block table_filter %}
<div class="d-flex flex-wrap gap-2 align-items-center">

    <div class="dropdown">
        <button
            class="btn btn-sm {% if filters_active %}btn-primary{% else %}btn-outline-secondary{% endif %} dropdown-toggle"
            type="button"
            id="tp-filter-dropdown-btn"
            data-bs-toggle="dropdown"
            data-bs-auto-close="outside"
            aria-expanded="false"
        >
            {% trans 'Filters' %}
            {% if filters_active %}
                <span class="ms-1">
                    · {% trans 'Active' %}
                </span>
            {% endif %}
        </button>

        <div
            class="dropdown-menu p-3"
            id="tp-filter-dropdown-menu"
            aria-labelledby="tp-filter-dropdown-btn"
            style="min-width: 22rem;"
        >
            <form method="get">

                <div class="mb-3">
                    <label
                        for="{{ filter.form.unique_name.id_for_label }}"
                        class="form-label"
                    >
                        {{ filter.form.unique_name.label }}
                    </label>

                    {{ filter.form.unique_name }}
                </div>

                <div class="mb-3">
                    <label
                        for="{{ filter.form.ca_type_group.id_for_label }}"
                        class="form-label"
                    >
                        {{ filter.form.ca_type_group.label }}
                    </label>

                    {{ filter.form.ca_type_group }}
                </div>

                <div class="mb-3">
                    <label
                        for="{{ filter.form.is_active.id_for_label }}"
                        class="form-label"
                    >
                        {{ filter.form.is_active.label }}
                    </label>

                    {{ filter.form.is_active }}
                </div>

                <div class="d-flex justify-content-between gap-2">
                    <a
                        href="{% url table_url %}"
                        class="btn btn-sm btn-outline-secondary"
                    >
                        {% trans 'Reset' %}
                    </a>

                    <button
                        type="submit"
                        class="btn btn-sm btn-primary"
                    >
                        {% trans 'Apply Filters' %}
                    </button>
                </div>

            </form>
        </div>
    </div>

    {% include "shared/partials/export_button.html" %}

</div>
{% endblock table_filter %}
