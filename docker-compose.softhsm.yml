# Standalone optional SoftHSM deployment; add --profile worker for workflows2.
x-trustpoint: &trustpoint-service
  build:
    context: .
    dockerfile: docker/trustpoint/Dockerfile
  image: "${TRUSTPOINT_IMAGE:-trustpointproject/trustpoint:latest}"
  restart: unless-stopped
  env_file:
    - .env
  environment: &trustpoint-environment
    POSTGRES_DB: "${POSTGRES_DB:-trustpoint_db}"
    DATABASE_USER_FILE: /run/secrets/db_user
    DATABASE_PASSWORD_FILE: /run/secrets/db_password
    DJANGO_SECRET_KEY_FILE: "${DJANGO_SECRET_KEY_FILE:-/run/secrets/django_secret_key}"
    DATABASE_HOST: "${DATABASE_HOST:-postgres}"
    DATABASE_PORT: "${DATABASE_PORT:-5432}"
    TRUSTPOINT_HSM_ROOT: /var/lib/trustpoint/hsm
    SOFTHSM2_CONF: /var/lib/trustpoint/hsm/config/softhsm2.conf
    TRUSTPOINT_LOCAL_HSM_ENABLED: "1"
    TRUSTPOINT_LOCAL_HSM_TOKEN_LABEL: Trustpoint-SoftHSM
    TRUSTPOINT_LOCAL_HSM_PROFILE_NAME: local-dev-softhsm
    TRUSTPOINT_LOCAL_HSM_MODULE_PATH: /usr/lib/libsofthsm2.so
    TRUSTPOINT_LOCAL_HSM_USER_PIN_FILE: /var/lib/trustpoint/hsm/config/user-pin.txt
    TRUSTPOINT_LOCAL_HSM_CONFIG_ENV_VAR: SOFTHSM2_CONF
    TRUSTPOINT_LOCAL_HSM_SOFTHSM2_CONF: /var/lib/trustpoint/hsm/config/softhsm2.conf
  volumes:
    - trustpoint_bootstrap:/var/lib/trustpoint/bootstrap
    - trustpoint_media:/var/www/html/trustpoint/trustpoint/media
    - trustpoint_hsm:/var/lib/trustpoint/hsm
    - ./trustpoint/settings:/var/www/html/trustpoint/trustpoint/settings:ro
    - softhsm_config:/var/lib/trustpoint/hsm/config
    - softhsm_tokens:/var/lib/trustpoint/hsm/tokens
  secrets:
    - source: django_secret_key
      target: "${DJANGO_SECRET_KEY_FILE:-/run/secrets/django_secret_key}"
    - db_user
    - db_password

services:
  trustpoint:
    <<: *trustpoint-service
    container_name: trustpoint
    ports:
      - "${TP_HTTP_PORT:-80}:80"
      - "${TP_HTTPS_PORT:-443}:443"
    depends_on:
      softhsm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk --max-time 5 https://localhost/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Fresh schema + token/application setup can exceed the standard startup window.
      start_period: 300s

  trustpoint-worker:
    <<: *trustpoint-service
    profiles: [worker]
    container_name: trustpoint-worker
    environment:
      <<: *trustpoint-environment
      TRUSTPOINT_SERVICE_ROLE: worker
    depends_on:
      trustpoint:
        condition: service_healthy
      softhsm:
        condition: service_healthy

  postgres:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    image: trustpointproject/postgres:latest
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: "${POSTGRES_DB:-trustpoint_db}"
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  softhsm:
    build:
      context: .
      dockerfile: docker/softhsm/Dockerfile
    container_name: softhsm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SOFTHSM_PROXY_PORT:-5657}:5657"
    volumes:
      - softhsm_config:/var/lib/trustpoint/hsm/config
      - softhsm_tokens:/var/lib/trustpoint/hsm/tokens
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5657"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  django_secret_key:
    file: "${DJANGO_SECRET_KEY_HOST_FILE:-./secrets/django_secret_key}"
  db_user:
    file: db_user.txt
  db_password:
    file: db_password.txt

volumes:
  postgres_data:
  trustpoint_bootstrap:
  trustpoint_media:
  trustpoint_hsm:
  softhsm_config:
  softhsm_tokens:
