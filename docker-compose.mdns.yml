services:
  mdns-advertiser:
    build:
      context: .
      dockerfile: docker/mdns/Dockerfile
    network_mode: host
    restart: on-failure:3
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    init: true
    healthcheck:
      test: ["CMD", "avahi-browse", "-a", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
