name: Code Quality / License Check

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      # Self
      - ".github/workflows/check-licenses.yml"
      # Python Ecosystem
      - "**/pyproject.toml"
      - "**/setup.py"
      - "**/requirements*.txt"
      - "**/Pipfile.lock"
      - "**/uv.lock"

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv-action

      - name: Sync runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Generate license report
        run: |
          uv tool run pip-licenses \
            --python .venv/bin/python \
            --format=markdown \
            --order=license \
            > licenses.md

      - name: Check for incompatible licenses
        run: |
          LICENSES="$(uv tool run pip-licenses --python .venv/bin/python)"

          if echo "$LICENSES" | grep -iE "GPL-[0-9]|GPLv[0-9]" | grep -v "LGPL"; then
            echo "::error::Found GPL-licensed dependencies which may require review"
            echo "GPL licenses found:"
            echo "$LICENSES" | grep -iE "GPL-[0-9]|GPLv[0-9]" | grep -v "LGPL"
            exit 1
          fi

          if echo "$LICENSES" | grep -iE "Proprietary|Commercial"; then
            echo "::error::Found proprietary/commercial licenses that need review"
            echo "Proprietary licenses found:"
            echo "$LICENSES" | grep -iE "Proprietary|Commercial"
            exit 1
          fi

          echo "✅ No incompatible licenses detected"
