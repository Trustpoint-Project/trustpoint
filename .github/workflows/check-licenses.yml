name: Code Quality / License Check

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - ".github/workflows/check-licenses.yml"
      - "**/pyproject.toml"
      - "**/setup.py"
      - "**/requirements*.txt"
      - "**/Pipfile.lock"
      - "**/uv.lock"

jobs:
  check-licenses:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv-action

      - name: Sync runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Generate license report
        run: |
          uv tool run pip-licenses \
            --python .venv/bin/python \
            --format=markdown \
            --order=license \
            > licenses.md

      - name: Check for incompatible licenses
        run: |
          LICENSES="$(uv tool run pip-licenses \
            --python .venv/bin/python \
            --format=plain)"

          echo "Checking licenses..."

          # Reject GPL licenses, excluding LGPL.
          GPL_LICENSES="$(
            echo "$LICENSES" \
              | grep -iE "GPL-[0-9]|GPLv[0-9]" \
              | grep -vi "LGPL" \
              || true
          )"

          if [ -n "$GPL_LICENSES" ]; then
            echo "::error::Found GPL-licensed dependencies which may require review"
            echo "GPL licenses found:"
            echo "$GPL_LICENSES"
            exit 1
          fi

          # qrcode is BSD-licensed, but its PyPI metadata also contains
          # the "Other/Proprietary License" classifier.
          # It has been manually reviewed and is therefore excluded here.
          PROPRIETARY="$(
            echo "$LICENSES" \
              | grep -iE "Proprietary|Commercial" \
              | grep -viE "^[[:space:]]*qrcode[[:space:]]" \
              || true
          )"

          if [ -n "$PROPRIETARY" ]; then
            echo "::error::Found proprietary/commercial licenses that need review"
            echo "Proprietary licenses found:"
            echo "$PROPRIETARY"
            exit 1
          fi

          echo "✅ No incompatible licenses detected"