name: Tests / Enrollment Endpoints

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  enrollment-endpoints:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # Ports below 1024 require root on the runner, so the development server is
      # exposed on 8443 instead of the usual 443.
      TRUSTPOINT_HOST: 127.0.0.1:8443
      TLS_CERT: tests/data/x509/https_server.crt
      TLS_KEY: tests/data/x509/https_server.pem
      ENV_FILE: var/protocol_test_env.json
      # The CMP test enrolls an ML-DSA-65 certificate, which needs OpenSSL >= 3.5.
      OPENSSL_VERSION: 3.6.0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check whether the system OpenSSL supports ML-DSA
        id: openssl
        run: |
          if openssl version | awk '{split($2,a,"."); exit !(a[1]>3 || (a[1]==3 && a[2]>=5))}'; then
            echo "Using system $(openssl version)."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "System $(openssl version) is too old for ML-DSA, building ${OPENSSL_VERSION}."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache OpenSSL build
        if: steps.openssl.outputs.needs_build == 'true'
        id: openssl-cache
        uses: actions/cache@v6
        with:
          path: ~/openssl-local
          key: openssl-${{ env.OPENSSL_VERSION }}-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Build OpenSSL
        if: steps.openssl.outputs.needs_build == 'true' && steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar xf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure --prefix="$HOME/openssl-local" --openssldir="$HOME/openssl-local/ssl" shared
          make -j"$(nproc)"
          # install_ssldirs provides openssl.cnf, without which "openssl req" cannot run.
          make install_sw install_ssldirs

      - name: Use the locally built OpenSSL
        if: steps.openssl.outputs.needs_build == 'true'
        run: |
          echo "$HOME/openssl-local/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/openssl-local/lib64:$HOME/openssl-local/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify the OpenSSL toolchain
        run: |
          openssl version
          openssl genpkey -algorithm ML-DSA-65 -out /tmp/verify-mldsa.pem
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/verify-ec.pem
          openssl req -new -key /tmp/verify-ec.pem -subj '/CN=verify' -out /dev/null

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv-action
        with:
          run_migrations: true

      - name: Create CAs, domains and test devices
        run: uv run trustpoint/manage.py create_protocol_test_env --output "${ENV_FILE}"

      - name: Start Trustpoint HTTPS development server
        run: |
          mkdir -p reports
          uv run trustpoint/manage.py runserver_plus "${TRUSTPOINT_HOST}" \
            --cert-file "${TLS_CERT}" \
            --key-file "${TLS_KEY}" \
            --nopin \
            > reports/server.log 2>&1 &
          echo $! > server.pid

          for _ in $(seq 1 60); do
            if curl --silent --output /dev/null --cacert "${TLS_CERT}" "https://${TRUSTPOINT_HOST}/"; then
              echo "Server is up."
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time." >&2
          cat reports/server.log >&2
          exit 1

      - name: Test CMP, EST and REST enrollment
        run: |
          bash tests/scripts/test_protocol_endpoints.sh \
            --host "${TRUSTPOINT_HOST}" \
            --env-file "${ENV_FILE}" \
            --tls-cert "${TLS_CERT}" \
            --work-dir reports/enrollment

      - name: Stop Trustpoint development server
        if: always()
        run: |
          if [ -f server.pid ]; then
            pkill -P "$(cat server.pid)" || true
            kill "$(cat server.pid)" || true
          fi

      - name: Upload server log and issued certificates
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: enrollment-endpoint-reports
          path: reports/
