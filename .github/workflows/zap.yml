name: Security / ZAP Baseline Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure disposable operational deployment
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'

          TP_AUTO_SETUP=true
          TP_ADMIN_USERNAME=zap-admin
          TP_ADMIN_PASSWORD=synthetic-zap-ci-password-321
          TP_INJECT_DEMO_DATA=false
          ENV
          sudo python3 docker/init_secret.py --type all
          rm -rf reports/zap
          mkdir -p reports/zap
          chmod a+w reports/zap

      - name: Start Trustpoint from this checkout
        run: docker compose up -d --build --wait --wait-timeout 300 postgres trustpoint

      - name: Require completed setup and operational login endpoint
        run: |
          for attempt in {1..60}; do
            echo "Checking operational readiness ($attempt/60)"
            if docker compose exec -T --user www-data -e TRUSTPOINT_PHASE=operational trustpoint \
              .venv/bin/python trustpoint/manage.py shell -c \
              "from setup_wizard.models import SetupWizardCompletedModel; from django.contrib.auth import get_user_model; assert SetupWizardCompletedModel.objects.filter(pk=1, setup_completed_at__isnull=False).exists(); assert get_user_model().objects.filter(username='zap-admin', is_superuser=True).exists()" \
              > reports/zap/readiness.log 2>&1 &&
              [ "$(curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://localhost/users/login/)" = 200 ]; then
              exit 0
            fi
            sleep 2
          done
          echo '::error::Operational setup/login did not become ready'
          exit 1

      - name: Check deployed security headers and HTTP enrollment routing
        run: python3 tests/docker_security/check_response_headers.py --insecure

      - name: Check CSP compatibility in Chromium
        env:
          TP_CSP_USERNAME: zap-admin
          TP_CSP_PASSWORD: synthetic-zap-ci-password-321
        run: |
          npm install --prefix "$RUNNER_TEMP/csp-browser" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/csp-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          NODE_PATH="$RUNNER_TEMP/csp-browser/node_modules" node tests/docker_security/csp_browser.cjs

      - name: Run independent HTTP and HTTPS baselines
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          for protocol in http https; do
            status=0
            timeout 600 docker run --rm --network host \
              -v "$PWD/reports/zap:/zap/wrk:rw" \
              ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
              -t "$protocol://localhost" -a -T 5 \
              -J "$protocol.json" -w "$protocol.md" -r "$protocol.html" \
              > "reports/zap/$protocol.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "reports/zap/$protocol.exit"
          done

      - name: Check scan completion, report integrity and finding policy
        if: always()
        run: python3 .github/check_zap_reports.py reports/zap

      - name: Upload ZAP evidence even on failure
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-reports
          path: reports/zap/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup disposable deployment
        if: always()
        run: docker compose down -v --remove-orphans
