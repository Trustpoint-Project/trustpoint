name: CI/CD / Publish to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify package version and Git release tag
        id: get_version
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          packages = tomllib.loads(Path('uv.lock').read_text())['package']
          locked = next(package['version'] for package in packages if package['name'] == 'trustpoint')
          if locked != version:
              raise SystemExit('Project version and uv.lock disagree')
          tag = f'v{version}'
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/{tag}':
              raise SystemExit(f'Git release tag must match package version: expected {tag}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'package_version={version}\nversion={tag}\n')
          print(f'Package version: {version}; release tag: {tag}')
          PYTHON

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata for trustpoint
        id: meta-trustpoint
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/trustpoint
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
            type=raw,value=${{ steps.get_version.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.get_version.outputs.package_version }}

      - name: Generate Docker metadata for postgres
        id: meta-postgres
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/trustpoint-postgres
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
            type=raw,value=${{ steps.get_version.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.get_version.outputs.package_version }}

      - name: Build and push trustpoint image
        id: push-trustpoint
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/trustpoint/Dockerfile
          push: true
          tags: ${{ steps.meta-trustpoint.outputs.tags }}
          labels: ${{ steps.meta-trustpoint.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trustpoint:latest
          cache-to: type=inline

      - name: Generate attestation for trustpoint
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/trustpoint
          subject-digest: ${{ steps.push-trustpoint.outputs.digest }}
          push-to-registry: true

      - name: Build and push postgres image
        id: push-postgres
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/db/Dockerfile
          push: true
          tags: ${{ steps.meta-postgres.outputs.tags }}
          labels: ${{ steps.meta-postgres.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/trustpoint-postgres:latest
          cache-to: type=inline

      - name: Generate attestation for postgres
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/trustpoint-postgres
          subject-digest: ${{ steps.push-postgres.outputs.digest }}
          push-to-registry: true

      - name: Show published image tags
        env:
          TRUSTPOINT_IMAGE_TAGS: ${{ steps.meta-trustpoint.outputs.tags }}
          POSTGRES_IMAGE_TAGS: ${{ steps.meta-postgres.outputs.tags }}
        run: |
          printf '%s\n' "$TRUSTPOINT_IMAGE_TAGS" "$POSTGRES_IMAGE_TAGS"
