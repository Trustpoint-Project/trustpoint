name: Tests / Behave Template

on:
  workflow_call:
    inputs:
      feature_path:
        description: "Feature file or capability directory below trustpoint/features"
        required: true
        type: string

jobs:
  behave:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv-action
        with:
          run_migrations: true

      - name: Run Behave tests
        run: |
          uv run trustpoint/manage.py behave \
            --format behave_html_pretty_formatter:PrettyHTMLFormatter \
            --outfile behave-report.html \
            trustpoint/features/${{ inputs.feature_path }}

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: behave-${{ inputs.feature_path }}-report
          path: behave-report.html
