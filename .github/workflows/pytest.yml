name: Tests / Pytest

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv-action
        with:
          run_migrations: true

      - name: Run Pytest and create reports
        run: |
          uv run python tests/scripts/build_redoc_csp.py --check
          mkdir -p reports
          uv run pytest \
          --md-report-flavor github \
          --md-report-color never \
          --cov=trustpoint \
          --cov-report=xml:reports/coverage.xml \
          --html=reports/pytest-report.html \
          --junitxml=reports/junit-report.xml \
          trustpoint/ tests/

      - name: Display Summary in GitHub Actions even if tests fail
        if: always()
        run: |
          echo "<details><summary>Pytest Report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f md-report.md ]; then
            cat md-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "md-report.md was not generated; see the pytest log." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Reports even if tests fail
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-reports
          path: reports/

      - name: Upload coverage to Codecov
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./reports/coverage.xml
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: >
          !cancelled() &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./reports/junit-report.xml
          report_type: test_results

      - name: Render the report to the PR
        uses: marocchino/sticky-pull-request-comment@v3
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          header: test-report
          recreate: true
          path: md-report.md

  pytest-postgres:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:19.0
        env:
          POSTGRES_DB: trustpoint_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testing321
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d trustpoint_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TRUSTPOINT_OPERATIONAL_DATABASE: postgresql
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      POSTGRES_DB: trustpoint_db
      DATABASE_USER: admin
      DATABASE_PASSWORD: testing321

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv-action
        with:
          run_migrations: true

      - name: Run database-sensitive tests on PostgreSQL
        run: |
          uv run pytest \
            trustpoint/users/tests/test_service_accounts.py \
            trustpoint/devices/tests/test_gds_push_audit_regressions.py \
            trustpoint/workflows2/tests/test_dispatch.py \
            trustpoint/workflows2/tests/test_worker.py \
            trustpoint/workflows2/tests/test_crash_recovery.py \
            -q -o md_report=false
