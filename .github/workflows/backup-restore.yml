name: Tests / Backup & Restore

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backup-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure disposable deployment and original secrets
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'

          TP_AUTO_SETUP=true
          TP_ADMIN_USERNAME=admin
          TP_ADMIN_PASSWORD=testing321
          TP_INJECT_DEMO_DATA=true
          ENV
          sudo python3 docker/init_secret.py --type all

      - name: Build and start deployment
        run: docker compose up -d --build --wait --wait-timeout 300 postgres trustpoint

      - name: Validate original deployment
        run: ./tests/scripts/test_successfull_restoration.sh

      - name: Back up database and verify manifest
        run: |
          docker compose exec -T --user www-data -e TRUSTPOINT_PHASE=operational trustpoint \
            .venv/bin/python trustpoint/manage.py trustpointbackup --filename recovery.dump.gz
          docker compose exec -T --user www-data -e TRUSTPOINT_PHASE=operational trustpoint \
            .venv/bin/python trustpoint/manage.py trustpointbackup_manifest --filename recovery.dump.gz --verify

      - name: Stop application and recreate empty database
        run: |
          docker compose stop trustpoint
          docker compose exec -T postgres dropdb -U admin --force trustpoint_db
          docker compose exec -T postgres createdb -U admin trustpoint_db

      - name: Restore using original secrets and runtime volumes
        run: |
          docker compose run --rm --no-deps --user www-data \
            -e TRUSTPOINT_PHASE=operational --entrypoint .venv/bin/python trustpoint \
            trustpoint/manage.py dbrestore -z --noinput -i recovery.dump.gz

      - name: Start restored deployment
        run: docker compose up -d --wait --wait-timeout 300 postgres trustpoint

      - name: Validate restored deployment and encrypted TLS key
        run: |
          ./tests/scripts/test_successfull_restoration.sh
          docker compose exec -T --user www-data -e TRUSTPOINT_PHASE=operational trustpoint \
            .venv/bin/python trustpoint/manage.py shell -c \
            "from pki.models.truststore import ActiveTrustpointTlsServerCredentialModel; credential = ActiveTrustpointTlsServerCredentialModel.objects.get(pk=1).credential; assert credential.get_private_key() is not None"

      - name: Show deployment logs
        if: always()
        run: docker compose logs --tail=100

      - name: Cleanup disposable deployment
        if: always()
        run: docker compose down -v --remove-orphans
