name: Tests / Backup & Restore

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backup-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure disposable deployment and original secrets
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'

          TP_AUTO_SETUP=true
          TP_ADMIN_USERNAME=admin
          TP_ADMIN_PASSWORD=testing321
          TP_INJECT_DEMO_DATA=true
          ENV
          sudo python3 docker/init_secret.py --type all

      - name: Build and start deployment
        run: docker compose up -d --build --wait --wait-timeout 300 postgres trustpoint

      - name: Validate original deployment
        run: ./tests/scripts/test_successfull_restoration.sh

      - name: Back up database and verify manifest
        run: |
          docker compose exec -T --user www-data -e TRUSTPOINT_PHASE=operational trustpoint \
            .venv/bin/python trustpoint/manage.py trustpointbackup --filename recovery.dump.gz
          docker compose exec -T --user www-data -e TRUSTPOINT_PHASE=operational trustpoint \
            .venv/bin/python trustpoint/manage.py trustpointbackup_manifest --filename recovery.dump.gz --verify

      - name: Verify encrypted backup restoration through the setup wizard
        run: |
          docker compose exec -T postgres createdb -U admin trustpoint_encrypted_restore
          docker compose exec -T --user www-data \
            -e TRUSTPOINT_PHASE=bootstrap -e DJANGO_SETTINGS_MODULE=trustpoint.settings_bootstrap \
            -e HOME=/run/trustpoint/home \
            -e POSTGRES_DB=trustpoint_encrypted_restore trustpoint \
            .venv/bin/python trustpoint/manage.py shell --no-imports \
            < tests/scripts/check_encrypted_backup_restore.py
          docker compose exec -T postgres dropdb -U admin trustpoint_encrypted_restore

      - name: Stop application and recreate empty database
        run: |
          docker compose stop trustpoint
          docker compose exec -T postgres dropdb -U admin --force trustpoint_db
          docker compose exec -T postgres createdb -U admin trustpoint_db

      - name: Restore using original secrets and runtime volumes
        run: |
          docker compose run --rm --no-deps --user www-data \
            -e TRUSTPOINT_PHASE=operational --entrypoint .venv/bin/python trustpoint \
            trustpoint/manage.py dbrestore -z --noinput -i recovery.dump.gz

      - name: Start restored deployment
        run: docker compose up -d --wait --wait-timeout 300 postgres trustpoint

      - name: Validate restored deployment and encrypted TLS key
        run: |
          ./tests/scripts/test_successfull_restoration.sh
          docker compose exec -T --user www-data -e TRUSTPOINT_PHASE=operational trustpoint \
            .venv/bin/python trustpoint/manage.py shell -c \
            "from pki.models.truststore import ActiveTrustpointTlsServerCredentialModel; credential = ActiveTrustpointTlsServerCredentialModel.objects.get(pk=1).credential; assert credential.get_private_key() is not None"

      - name: Show deployment logs
        if: always()
        run: docker compose logs --tail=100

      - name: Cleanup disposable deployment
        if: always()
        run: docker compose down -v --remove-orphans
  restore-v1-reference:
    name: Upgrade v1.0.0 reference backup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRUSTPOINT_PHASE: operational
      TRUSTPOINT_OPERATIONAL_DATABASE: postgresql
      TRUSTPOINT_IMAGE: trustpoint-reference-upgrade:ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify reference backup
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          backup = Path('tests/fixtures/reference-v1.0.0/reference-v1.0.0.dump.gz')
          manifest = json.loads(backup.with_name(backup.name + '.manifest.json').read_text())
          assert manifest['manifest_version'] == 1
          assert manifest['trustpoint_version'] == '1.0.0'
          assert manifest['database_engine'] == 'postgresql'
          assert hashlib.file_digest(backup.open('rb'), 'sha256').hexdigest() == manifest['payload_sha256']
          PY

      - name: Prepare deployment with original fixture keys
        run: |
          cp .env.example .env
          mkdir -p secrets
          sudo tar --extract --gzip --file tests/fixtures/reference-v1.0.0/test-secrets.tar.gz \
            --directory secrets --no-same-owner django_secret_key trustpoint_software_kek
          sudo chown root:33 secrets/django_secret_key secrets/trustpoint_software_kek
          sudo chmod 0440 secrets/django_secret_key secrets/trustpoint_software_kek

      - name: Build current application and start empty PostgreSQL
        run: |
          docker compose build
          docker compose up -d --wait --wait-timeout 120 postgres

      - name: Restore v1.0.0 database before current migrations
        run: |
          gzip -dc tests/fixtures/reference-v1.0.0/reference-v1.0.0.dump.gz \
            | docker compose exec -T postgres pg_restore \
                --exit-on-error --no-owner --no-privileges --username admin --dbname trustpoint_db

      - name: Start current application and migrate restored database
        run: docker compose up -d --wait --wait-timeout 300 trustpoint

      - name: Validate HTTPS and restored deployment
        run: ./tests/scripts/test_successfull_restoration.sh

      - name: Check migrations and restored data and signing key
        run: |
          docker compose exec -T --user www-data trustpoint \
            .venv/bin/python trustpoint/manage.py migrate --check
          docker compose exec -T --user www-data trustpoint \
            .venv/bin/python trustpoint/manage.py shell --no-imports \
            < tests/scripts/check_reference_upgrade.py

      - name: Show deployment logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove test deployment
        if: always()
        run: docker compose down --volumes
