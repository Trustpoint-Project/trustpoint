name: Tests / Migrations Compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/migrations/**"
      - trustpoint/pki/tests/test_management_ca_migration.py
      - trustpoint/management/tests/test_security_config_migration.py
      - .github/workflows/test-migrations-compatibility.yml
      - .github/actions/setup-uv-action/**

env:
  TRUSTPOINT_OPERATIONAL_DATABASE: "sqlite"

permissions:
  contents: read

jobs:
  test-management-ca-migration-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: migration-test
          POSTGRES_DB: management_ca_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d management_ca_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRUSTPOINT_OPERATIONAL_DATABASE: postgresql
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: review
      DATABASE_PASSWORD: migration-test
      POSTGRES_DB: management_ca_migration
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv-action

      - name: Test management CA and security migrations on PostgreSQL
        run: uv run pytest trustpoint/pki/tests/test_management_ca_migration.py trustpoint/management/tests/test_security_config_migration.py -q -o md_report=false

  test-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv-action

      - name: Keep the database outside checkout cleanup
        run: echo "TRUSTPOINT_OPERATIONAL_SQLITE_PATH=$RUNNER_TEMP/migration-compatibility.sqlite3" >> "$GITHUB_ENV"

      - name: Apply current branch migrations
        run: uv run manage.py migrate
        working-directory: trustpoint

      - name: Test security configuration column compatibility
        run: uv run pytest trustpoint/management/tests/test_security_config_migration.py -q -o md_report=false

      - name: Seed a row to verify after checkout
        run: |
          uv run trustpoint/manage.py shell -c "from management.models.organization import OrganizationModel; OrganizationModel.objects.create(name='migration-compatibility-probe')"

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Sync dependencies for base branch
        run: uv sync --locked

      - name: Verify base code works with new schema
        run: |
          uv run manage.py check
          uv run manage.py showmigrations
          uv run manage.py shell -c "from management.models.organization import OrganizationModel; from django.apps import apps; assert OrganizationModel.objects.get(name='migration-compatibility-probe').organization == 'trustpoint'; [list(model._default_manager.all()[:1]) for model in apps.get_models() if model._meta.managed and not model._meta.proxy]"
          echo "✅ Migrations are compatible with base branch"
        working-directory: trustpoint
