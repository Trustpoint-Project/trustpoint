name: Docs / Generate Architecture

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
  push:
    branches:
      - main
    paths:
      - 'trustpoint/**/models.py'
      - 'trustpoint/**/urls.py'
      - 'trustpoint/**/apps.py'
      - '.github/generate_architecture_docs.py'

permissions:
  contents: write

concurrency:
  group: generate-architecture-docs
  cancel-in-progress: false

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'  # Match the Docker runtime and supported dependency wheels.
          
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          
      - name: Install dependencies
        run: |
          uv sync --all-groups
          
      - name: Generate architecture documentation
        run: |
          uv run python .github/generate_architecture_docs.py
          
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code docs/source/development/architecture/generated || echo "changed=true" >> $GITHUB_OUTPUT
          
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/source/development/architecture/generated/
          git commit -m "docs: auto-generate architecture documentation [skip ci]"
          git push
