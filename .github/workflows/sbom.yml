name: Security / SBOM and CBOM

on:
  push:
    branches:
      - cbom
  workflow_dispatch:
  # TODO: Re-enable for production
  # push:
  #   branches:
  #     - main
  # release:
  #   types:
  #     - published

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  bom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Trustpoint repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Syft
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.42.1

          syft version

      - name: Build Trustpoint Docker image
        shell: bash
        run: |
          docker build \
            --tag trustpoint:latest \
            --file docker/trustpoint/Dockerfile \
            .

      - name: Determine BOM version
        id: bom_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi

          # Prevent branch-name slashes from creating nested directories.
          VERSION="${VERSION//\//-}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Generates the source-code-derived CBOM.
      - name: Generate source-code CBOM
        id: generated_cbom
        uses: cbomkit/cbomkit-action@v2.2.0
        env:
          CBOMKIT_LANGUAGES: python
          CBOMKIT_OUTPUT_DIR: cbom-output
          CBOMKIT_GENERATE_MODULE_CBOMS: "false"

      - name: Verify generated CBOM
        shell: bash
        run: |
          test -s cbom-output/cbom.json
          python -m json.tool cbom-output/cbom.json > /dev/null

      - name: Debug cbom-output directory
        shell: bash
        run: |
          echo "Contents of cbom-output:"
          ls -la cbom-output/
          echo "Checking if output path exists as directory:"
          if [ -d "cbom-output/trustpoint.cbom.cyclonedx.json" ]; then
            echo "ERROR: Output path exists as a directory!"
            rm -rf "cbom-output/trustpoint.cbom.cyclonedx.json"
          fi

      # Adds Trustpoint-specific assets that cannot be reliably inferred
      # from the Python source code alone.
      - name: Merge Trustpoint CBOM enrichments
        shell: bash
        run: |
          python .github/cbom/merge_cbom.py \
            --generated cbom-output/cbom.json \
            --manual .github/cbom/trustpoint-cmp.cdx.json \
            --manual .github/cbom/trustpoint-est.cdx.json \
            --manual .github/cbom/trustpoint-pkcs11.cdx.json \
            --output cbom-output/trustpoint.cbom.cyclonedx.json \
            --trustpoint-version "${{ steps.bom_version.outputs.version }}"

          test -s cbom-output/trustpoint.cbom.cyclonedx.json

          python -m json.tool \
            cbom-output/trustpoint.cbom.cyclonedx.json \
            > /dev/null

      - name: Validate merged CBOM
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/work:ro" \
            cyclonedx/cyclonedx-cli:0.32.0 \
            validate \
            --input-file /work/cbom-output/trustpoint.cbom.cyclonedx.json \
            --input-format json \
            --input-version v1_6 \
            --fail-on-errors

      - name: Generate SBOMs and prepare GitHub Pages
        shell: bash
        run: |
          VERSION="${{ steps.bom_version.outputs.version }}"

          mkdir -p public/sbom/latest
          mkdir -p "public/sbom/${VERSION}"
          mkdir -p public/cbom/latest
          mkdir -p "public/cbom/${VERSION}"

          # Generate container SBOMs.
          syft docker:trustpoint:latest \
            -o cyclonedx-json=public/sbom/latest/trustpoint.cyclonedx.json

          syft docker:trustpoint:latest \
            -o spdx-json=public/sbom/latest/trustpoint.spdx.json

          # Create versioned SBOM copies.
          cp public/sbom/latest/trustpoint.cyclonedx.json \
            "public/sbom/${VERSION}/trustpoint-${VERSION}.cyclonedx.json"

          cp public/sbom/latest/trustpoint.spdx.json \
            "public/sbom/${VERSION}/trustpoint-${VERSION}.spdx.json"

          # Publish the merged source and manually enriched CBOM.
          cp cbom-output/trustpoint.cbom.cyclonedx.json \
            public/cbom/latest/trustpoint.cbom.cyclonedx.json

          cp cbom-output/trustpoint.cbom.cyclonedx.json \
            "public/cbom/${VERSION}/trustpoint-${VERSION}.cbom.cyclonedx.json"

          # Prevent GitHub Pages from applying Jekyll processing.
          touch public/.nojekyll

      - name: Verify publication files
        shell: bash
        run: |
          VERSION="${{ steps.bom_version.outputs.version }}"

          FILES=(
            "public/sbom/latest/trustpoint.cyclonedx.json"
            "public/sbom/latest/trustpoint.spdx.json"
            "public/cbom/latest/trustpoint.cbom.cyclonedx.json"
            "public/sbom/${VERSION}/trustpoint-${VERSION}.cyclonedx.json"
            "public/sbom/${VERSION}/trustpoint-${VERSION}.spdx.json"
            "public/cbom/${VERSION}/trustpoint-${VERSION}.cbom.cyclonedx.json"
          )

          for file in "${FILES[@]}"; do
            test -s "$file"
            python -m json.tool "$file" > /dev/null
          done

      - name: Create BOM index page
        shell: bash
        run: |
          VERSION="${{ steps.bom_version.outputs.version }}"

          cat > public/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Trustpoint Bills of Materials</title>
          </head>
          <body>
            <h1>Trustpoint Bills of Materials</h1>

            <p>
              The SBOMs are generated from the Trustpoint Docker image using
              Syft. The CBOM is generated from the Python source code using
              CBOMkit and enriched with manually maintained Trustpoint
              cryptographic assets.
            </p>

            <h2>Latest</h2>

            <h3>Software Bill of Materials</h3>
            <ul>
              <li>
                <a href="sbom/latest/trustpoint.cyclonedx.json">
                  SBOM – CycloneDX JSON
                </a>
              </li>
              <li>
                <a href="sbom/latest/trustpoint.spdx.json">
                  SBOM – SPDX JSON
                </a>
              </li>
            </ul>

            <h3>Cryptography Bill of Materials</h3>
            <ul>
              <li>
                <a href="cbom/latest/trustpoint.cbom.cyclonedx.json">
                  CBOM – CycloneDX JSON
                </a>
              </li>
            </ul>

            <h2>${VERSION}</h2>

            <h3>Software Bill of Materials</h3>
            <ul>
              <li>
                <a href="sbom/${VERSION}/trustpoint-${VERSION}.cyclonedx.json">
                  SBOM – CycloneDX JSON
                </a>
              </li>
              <li>
                <a href="sbom/${VERSION}/trustpoint-${VERSION}.spdx.json">
                  SBOM – SPDX JSON
                </a>
              </li>
            </ul>

            <h3>Cryptography Bill of Materials</h3>
            <ul>
              <li>
                <a href="cbom/${VERSION}/trustpoint-${VERSION}.cbom.cyclonedx.json">
                  CBOM – CycloneDX JSON
                </a>
              </li>
            </ul>
          </body>
          </html>
          EOF

      - name: Publish BOMs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          keep_files: true
          allow_empty_commit: true