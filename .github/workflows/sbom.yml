name: Security / SBOM

on:
  workflow_call:
    inputs:
      image:
        description: Published image reference including its sha256 digest
        required: true
        type: string
      version:
        description: Release tag or commit identifier
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: Published image reference including its sha256 digest
        required: true
        type: string
      version:
        description: Release tag or commit identifier
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  sbom:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout Trustpoint repo
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.42.1
          syft version

      - name: Require immutable image and safe version path
        run: |
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9./:_-]*@sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || exit 1

      - name: Generate SBOMs for GitHub Pages
        run: |
          mkdir -p public/latest
          mkdir -p "public/${VERSION}"

          syft "registry:${IMAGE}" \
            -o cyclonedx-json=public/latest/trustpoint.cyclonedx.json

          syft "registry:${IMAGE}" \
            -o spdx-json=public/latest/trustpoint.spdx.json

          cp public/latest/trustpoint.cyclonedx.json \
            "public/${VERSION}/trustpoint-${VERSION}.cyclonedx.json"

          cp public/latest/trustpoint.spdx.json \
            "public/${VERSION}/trustpoint-${VERSION}.spdx.json"

          test -s public/latest/trustpoint.cyclonedx.json
          test -s public/latest/trustpoint.spdx.json
          test -s "public/${VERSION}/trustpoint-${VERSION}.cyclonedx.json"
          test -s "public/${VERSION}/trustpoint-${VERSION}.spdx.json"

      - name: Create SBOM index page
        run: |
          cat > public/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Trustpoint SBOMs</title>
          </head>
          <body>
            <h1>Trustpoint Software Bill of Materials</h1>

            <p>These SBOMs are generated from the Trustpoint Docker image using Syft.</p>

            <h2>Latest</h2>
            <ul>
              <li><a href="latest/trustpoint.cyclonedx.json">CycloneDX JSON</a></li>
              <li><a href="latest/trustpoint.spdx.json">SPDX JSON</a></li>
            </ul>

            <h2>${VERSION}</h2>
            <ul>
              <li><a href="${VERSION}/trustpoint-${VERSION}.cyclonedx.json">CycloneDX JSON</a></li>
              <li><a href="${VERSION}/trustpoint-${VERSION}.spdx.json">SPDX JSON</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Publish SBOMs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          destination_dir: sbom
          keep_files: true
          allow_empty_commit: true
