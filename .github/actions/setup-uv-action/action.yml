name: Setup Environment
description: Checks out code and installs the current uv version and it's dependencies defined inside the pyproject.toml file.
inputs:
  python-version:
    description: "Python version used by CI, matching the Docker runtime."
    required: false
    default: '3.14'
  run_migrations:
    description: "Boolean to run the database migrations or not."
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Install and setup uv
      uses: astral-sh/setup-uv@v10.3.3  # Sets up `uv` package manager.
      with:
        enable-cache: true  # Caches `uv` installation for faster runs.
        cache-dependency-glob: "uv.lock" # Invalidate cache when the lockfile changes.

    - name: Set up Python
      id: python
      uses: actions/setup-python@v7  # Sets up Python environment.
      with:
        python-version: ${{ inputs.python-version }}

    - name: Pin uv to the selected interpreter
      shell: bash
      env:
        PYTHON_PATH: ${{ steps.python.outputs.python-path }}
      run: echo "UV_PYTHON=${PYTHON_PATH}" >> "$GITHUB_ENV"

    - name: Initialize software KEK for database tests
      if: ${{ inputs.run_migrations == 'true' }}
      shell: bash
      run: |
        # Native CI commands run as the runner user, rather than container www-data.
        # Keep one key for this job's setup commands, tests, and server processes.
        kek_path="${RUNNER_TEMP}/trustpoint-ci-secrets/trustpoint_software_kek"
        sudo python3 docker/init_secret.py --type kek \
          --path "$kek_path" --group-id "$(id -g)"
        printf 'TRUSTPOINT_SOFTWARE_KEK_FILE=%s\n' "$kek_path" >> "$GITHUB_ENV"

    - name: Run database migrations # Resets the database before running tests.
      if: ${{ inputs.run_migrations == 'true' }} # Only run migrations if input is true.
      shell: bash
      run: |
        uv run trustpoint/manage.py reset_db --force --keep-all-migrations
