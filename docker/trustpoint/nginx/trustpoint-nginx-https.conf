# Preserve Django's per-response nonce policy. Redirects, static files and Nginx
# errors have no upstream header and receive a deny-by-default policy instead.
map $upstream_http_content_security_policy $trustpoint_csp {
    default $upstream_http_content_security_policy;
    "" "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'";
}

# HTTP server (CMP and CRLs only, everything else is redirected to HTTPS)
server {
    listen 80;
    server_name localhost;
    server_tokens off;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Content-Security-Policy $trustpoint_csp always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Set every trusted assertion at this level. Enrollment locations below
    # must not override individual proxy_set_header directives: doing so drops
    # the entire inherited set and would forward client-supplied TLS assertions.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header Host $http_host;
	proxy_set_header X-Forwarded-Host $http_host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Port $server_port;

    proxy_set_header SSL-Client-Cert "";
    proxy_set_header X-SSL-Client-Verify "NONE";
    proxy_set_header X-SSL-Client-S-DN "";
    proxy_set_header X-EST-TLS-Unique "";
    proxy_set_header X-EST-TLS-Unique-Supported "0";
    proxy_set_header X-EST-TLS-Protocol "";
        
    client_max_body_size 10M;

    location /crl/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /.well-known/cmp/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # SCEP messages are signed and encrypted themselves; RFC 8894 section 7.10 does not require TLS
    location /.well-known/scep/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;
    server_tokens off;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Content-Security-Policy $trustpoint_csp always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    ssl_certificate     /etc/trustpoint/tls/nginx-tls-server-cert.pem;
    ssl_certificate_key /etc/trustpoint/tls/nginx-tls-server-key.key;
    ssl_trusted_certificate /etc/trustpoint/tls/nginx-tls-server-cert-chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Client certificates
    ssl_verify_client optional_no_ca;
    ssl_verify_depth 2;

    # Static files
    location /static/ {
        alias /var/www/html/trustpoint/trustpoint/collected_static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_set_header X-EST-TLS-Unique $trustpoint_tls_unique;
        proxy_set_header X-EST-TLS-Unique-Supported $trustpoint_tls_unique_supported;
        proxy_set_header X-EST-TLS-Protocol $ssl_protocol;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 10M;
    }
}
